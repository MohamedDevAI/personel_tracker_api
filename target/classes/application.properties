# Personal Tracker / LifeOS Backend Configuration
server.port=8080
spring.application.name=lifeos-api

# Optionally import local properties (git-ignored) for local development credentials
spring.config.import=optional:application-local.properties

# ===================================================================
# MongoDB Atlas Connection
# Override with MONGODB_URI env var or application-local.properties
# ===================================================================
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://<username>:<password>@cluster0.mongodb.net/personal_tracker?retryWrites=true&w=majority}
spring.data.mongodb.auto-index-creation=true

# Logging
logging.level.org.springframework.data.mongodb=INFO
logging.level.com.personaltracker=INFO
